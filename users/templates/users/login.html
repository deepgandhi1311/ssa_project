{% load static %}
{% block title %}Login - ChipIn{% endblock %}

{% block content %}

        <form action="{% url 'users:login' %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Login">
        </form>
    </div>
{% endblock %}
